<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ジャマイカもどき｜8問チャレンジ</title>
  <style>
    :root{--ink:#263238;--blue:#1677c8;--yellow:#ffd54f;--orange:#ff8a3d;--green:#27ae60;--paper:#fffdf5;--shadow:0 8px 22px #17324d22}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;background:linear-gradient(135deg,#bfe9ff,#fff4b8)}
    button{font:inherit;touch-action:manipulation}.app{width:min(760px,100%);margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{font-size:clamp(25px,6vw,42px);font-weight:900;color:#075f9d;text-shadow:2px 2px white;margin:4px 0}.pill{background:#fff;border:3px solid #82c8ee;border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:var(--shadow)}
    .card{background:var(--paper);border:5px solid white;border-radius:28px;padding:clamp(14px,4vw,28px);box-shadow:var(--shadow);position:relative;overflow:hidden}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.stat{background:#e9f7ff;border-radius:15px;padding:9px;text-align:center;font-weight:800}.stat strong{display:block;font-size:clamp(20px,5vw,30px);color:#0874bc}.home{display:inline-flex;align-items:center;text-decoration:none;color:#075f9d;background:#fff;border:3px solid #82c8ee;border-radius:999px;padding:8px 13px;font-weight:900;box-shadow:var(--shadow)}
    .board{position:relative;width:min(390px,92vw);aspect-ratio:1;margin:4px auto 10px}.num,.target{position:absolute;display:grid;place-items:center;border-radius:50%;font-weight:900;box-shadow:0 5px 0 #0002;user-select:none}.num{width:23%;height:23%;border:0;background:var(--yellow);color:#5b3d00;font-size:clamp(30px,9vw,50px);cursor:pointer}.num:disabled{opacity:.3;filter:grayscale(1);transform:scale(.9)}.num:nth-child(1){left:38.5%;top:0}.num:nth-child(2){right:3%;top:27%}.num:nth-child(3){right:17%;bottom:4%}.num:nth-child(4){left:17%;bottom:4%}.num:nth-child(5){left:3%;top:27%}.target{width:38%;height:38%;left:31%;top:31%;background:var(--orange);color:#fff;font-size:clamp(42px,13vw,70px);border:7px solid #fff}.target small{display:block;font-size:12px;line-height:1;margin-bottom:-15px}
    .mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 auto 6px;width:min(420px,100%)}.mode-btn{border:2px solid #1681c5;border-radius:999px;padding:7px;background:#fff;color:#0966a0;font-weight:900;cursor:pointer}.mode-btn.active{background:#1681c5;color:#fff}.expression{min-height:72px;background:#fff;border:4px dashed #80c6e8;border-radius:18px;padding:8px 12px;text-align:center;font-size:clamp(22px,5vw,34px);font-weight:900;word-break:break-all;overflow:auto}.expression .done{font-size:.62em;color:#52717d;line-height:1.25}.expression .current{min-height:1.3em}.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.key{border:0;border-radius:14px;background:#1677c8;color:#fff;min-height:52px;font-size:27px;font-weight:900;box-shadow:0 4px 0 #0c558f;cursor:pointer}.key.equals{display:none;background:#e97922;box-shadow:0 4px 0 #a94c0b}.step-mode .keypad{grid-template-columns:repeat(5,1fr)}.step-mode .key.equals{display:block}.key:active,.action:active{transform:translateY(3px);box-shadow:none}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.step-mode .actions{grid-template-columns:1fr 1fr}.step-mode .check{display:none}.action{border:0;border-radius:15px;padding:13px 8px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #0002}.undo{background:#e4edf2}.clear{background:#ffe0b2}.check{background:var(--green);color:#fff}.message{min-height:55px;margin-top:12px;padding:12px;border-radius:16px;text-align:center;font-weight:900;font-size:18px}.message.ok{background:#dff7e7;color:#12652f}.message.bad{background:#ffe2e2;color:#a22222}.bottom{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.secondary{border:2px solid #1681c5;background:#fff;color:#0966a0;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer}
    .modal{position:fixed;inset:0;background:#07365cdd;display:none;place-items:center;padding:20px;z-index:5}.modal.show{display:grid}.celebrate{width:min(520px,96vw);background:#fff9d6;border:8px solid #ffd54f;border-radius:32px;padding:28px;text-align:center;animation:pop .45s ease}.celebrate h2{font-size:clamp(35px,10vw,60px);margin:0;color:#f06b25}.celebrate p{font-size:22px;font-weight:900}.celebrate button{border:0;border-radius:999px;background:#1d9a54;color:#fff;padding:15px 25px;font-weight:900;font-size:20px}@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
    @media(max-width:520px){.app{padding:8px}.card{border-radius:20px;padding:12px}.stats{gap:5px}.stat{font-size:12px;padding:7px 3px}.keypad{gap:6px}.key{min-height:48px}.board{width:min(330px,88vw)}}
    /* 画面の高さに合わせた1画面表示 */
    @media(max-height:900px){
      body{overflow:hidden}.app{height:100vh;height:100dvh;padding:5px 8px;display:flex;flex-direction:column}.top{min-height:32px;flex-wrap:nowrap}.home,.pill{padding:4px 10px;border-width:2px;font-size:12px}.title{font-size:clamp(19px,4vw,27px);line-height:1.1;margin:1px 0 2px}.mode-switch{margin-bottom:3px}.mode-btn{padding:3px;font-size:11px}.card{flex:1;min-height:0;border-width:3px;border-radius:18px;padding:7px 10px;display:flex;flex-direction:column}.stats{gap:5px;margin-bottom:3px}.stat{padding:3px;font-size:11px;border-radius:10px}.stat strong{display:inline;margin-left:4px;font-size:16px}.board{width:min(32vh,280px,70vw);margin:0 auto 3px;flex:0 0 auto}.num{font-size:clamp(24px,7vw,40px)}.target{font-size:clamp(34px,10vw,55px);border-width:5px}.target small{font-size:10px;margin-bottom:-10px}.expression{min-height:40px;max-height:82px;padding:3px 8px;border-width:3px;border-radius:12px;font-size:clamp(19px,5vw,28px)}.keypad{gap:5px;margin-top:4px}.key{min-height:38px;border-radius:10px;font-size:22px;box-shadow:0 3px 0 #0c558f}.actions{grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}.action{min-height:38px;padding:5px 3px;border-radius:10px;font-size:12px}.check{grid-column:auto}.message{min-height:38px;margin-top:5px;padding:5px;border-radius:10px;font-size:13px;display:grid;place-items:center}.bottom{gap:4px;margin-top:5px;flex-wrap:nowrap}.secondary{padding:5px 7px;border-width:1px;font-size:11px;white-space:nowrap}
    }
    @media(max-height:680px){.title{font-size:18px}.board{width:min(29vh,210px,58vw)}.key{min-height:34px}.action{min-height:34px}.message{min-height:34px}.bottom{margin-top:3px}}
  </style>
</head>
<body>
<main class="app">
  <div class="top"><a class="home" href="index.html">← メニューへ戻る</a><span class="pill" id="progress">1 / 8</span></div>
  <h1 class="title">🎲 ジャマイカもどき</h1>
  <div class="mode-switch"><button class="mode-btn active" data-mode="single">1つの式</button><button class="mode-btn" data-mode="step">いくつかの式</button></div>
  <section class="card">
    <div class="stats"><div class="stat">タイム<strong id="timer">0.0秒</strong></div><div class="stat">ベスト<strong id="best">—</strong></div><div class="stat">正解数<strong id="score">0</strong></div></div>
    <div class="board" id="board"><button class="num"></button><button class="num"></button><button class="num"></button><button class="num"></button><button class="num"></button><div class="target"><small>めざす数</small><span id="target"></span></div></div>
    <div class="expression" id="expression" aria-live="polite">数字を押して式を作ろう！</div>
    <div class="keypad"><button class="key">＋</button><button class="key">−</button><button class="key">×</button><button class="key">÷</button><button class="key equals" id="stepEquals">＝</button></div>
    <div class="actions"><button class="action undo" id="undo">↩ ひとつ戻す</button><button class="action clear" id="clear">🧹 やり直す</button><button class="action check" id="check">✅ 答え合わせ</button></div>
    <div class="message" id="message">ちがう5つの数字を1回ずつ使おう。かっこはいらないよ！</div>
    <div class="bottom"><button class="secondary" id="hint">💡 ヒント</button><button class="secondary" id="newSet">🔄 新しい8問</button><button class="secondary" id="sound">🔊 音あり</button></div>
  </section>
</main>
<div class="modal" id="modal"><div class="celebrate"><div style="font-size:60px">🏆🎉🌟</div><h2>8問クリア！</h2><p id="finalText">すばらしい！ あなたは計算名人です！</p><p id="totalTime"></p><button id="again">もう一度8問に挑戦</button></div></div>
<script>
(()=>{'use strict';
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const els={app:$('.app'),nums:$$('.num'),keys:$$('.key:not(.equals)'),modes:$$('.mode-btn'),target:$('#target'),expr:$('#expression'),timer:$('#timer'),best:$('#best'),score:$('#score'),progress:$('#progress'),msg:$('#message'),modal:$('#modal'),final:$('#finalText'),total:$('#totalTime')};
  let set=[],index=0,solved=0,tokens=[],start=0,tick=null,elapsed=0,setStart=0,sound=true,mode='single',pool=[],stepHistory=[],uid=0;
  const opMap={'＋':'+','−':'-','×':'*','÷':'/'};
  function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function makeProblem(){
    const symbols=['＋','−','×','÷'];
    for(let tries=0;tries<1000;tries++){
      // 1〜9から重複なしで5個を選ぶ
      const nums=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,5);
      const order=shuffle([...nums]);
      const ops=Array.from({length:4},()=>symbols[Math.floor(Math.random()*symbols.length)]);
      const solution=order.map((n,i)=>i?ops[i-1]+n:String(n)).join('');
      const raw=solution.replaceAll('＋','+').replaceAll('−','-').replaceAll('×','*').replaceAll('÷','/');
      const val=Function('"use strict";return '+raw)();
      // 通常の計算順序で、括弧なしでも整数の答えになる問題だけを採用
      if(Number.isInteger(val)&&val>=10&&val<=150) return {nums,target:val,solution};
    }
    return {nums:[2,4,5,8,9],target:51,solution:'9×5＋8−4÷2'};
  }
  function newSet(){set=Array.from({length:8},makeProblem);index=0;solved=0;setStart=Date.now();els.modal.classList.remove('show');load()}
  function load(){elapsed=0;start=Date.now();clearInterval(tick);tick=setInterval(updateTimer,100);const p=set[index];els.target.textContent=p.target;els.score.textContent=solved;els.progress.textContent=`${index+1} / 8`;resetWork(false);showBest()}
  function resetWork(restart=true){tokens=[];stepHistory=[];pool=set[index].nums.map((value,i)=>({id:'n'+i,value}));if(restart){elapsed=0;start=Date.now()}els.msg.className='message';els.msg.textContent=mode==='single'?'5つの数字を1回ずつ使って、1つの式を作ろう！':'2つの数と記号を選び、＝を押そう！';render()}
  function updateTimer(){elapsed=(Date.now()-start)/1000;els.timer.textContent=elapsed.toFixed(1)+'秒'}
  function fmt(n){return Number.isInteger(n)?String(n):String(Math.round(n*1000)/1000)}
  function render(){
    if(mode==='single'){
      els.expr.textContent=tokens.length?tokens.map(t=>t.label).join(''):'数字を押して式を作ろう！';
      const used=new Set(tokens.filter(t=>t.type==='num').map(t=>t.id));
      els.nums.forEach((b,i)=>{b.hidden=false;b.textContent=set[index].nums[i];b.disabled=used.has(i);b.dataset.id=i});
    }else{
      const done=stepHistory.map(h=>`<div class="done">${h.text}</div>`).join('');
      const current=tokens.length?tokens.map(t=>t.label).join(''):'2つの数で計算しよう';
      els.expr.innerHTML=done+`<div class="current">${current}</div>`;
      const selected=new Set(tokens.filter(t=>t.type==='num').map(t=>t.id));
      els.nums.forEach((b,i)=>{const item=pool[i];b.hidden=!item;if(item){b.textContent=fmt(item.value);b.disabled=selected.has(item.id);b.dataset.poolId=item.id}});
    }
  }
  function addNum(i){
    if(els.nums[i].disabled||els.nums[i].hidden)return;
    if(mode==='single'){
      if(tokens.length&&tokens.at(-1).type!=='op')return;
      tokens.push({type:'num',label:els.nums[i].textContent,id:i});
    }else{
      if(!(tokens.length===0||tokens.length===2))return;
      const item=pool[i];tokens.push({type:'num',label:fmt(item.value),id:item.id,value:item.value});
    }
    render();
  }
  function addOp(label){if(tokens.length===0||tokens.at(-1).type!=='num')return;if(mode==='step'&&tokens.length!==1)return;tokens.push({type:'op',label});render()}
  function undo(){
    if(tokens.length){tokens.pop();render();return}
    if(mode==='step'&&stepHistory.length){const h=stepHistory.pop();pool=h.before.map(x=>({...x}));render()}
  }
  function clear(){resetWork()}
  function calc(a,op,b){if(op==='＋')return a+b;if(op==='−')return a-b;if(op==='×')return a*b;if(op==='÷')return b===0?NaN:a/b;return NaN}
  function calculateStep(){
    if(mode!=='step')return;
    if(tokens.length!==3)return feedback('数 → 記号 → 数の順に選んでね。',false);
    const [a,op,b]=tokens,result=calc(a.value,op.label,b.value);
    if(!Number.isFinite(result))return feedback('0では割れません。別の計算を選ぼう。',false);
    const before=pool.map(x=>({...x}));
    pool=pool.filter(x=>x.id!==a.id&&x.id!==b.id);
    pool.push({id:'r'+(++uid),value:result});
    stepHistory.push({text:`${a.label}${op.label}${b.label}＝${fmt(result)}`,before});tokens=[];render();
    if(pool.length===1){
      if(Math.abs(pool[0].value-set[index].target)<1e-9)correctAnswer();
      else feedback(`答えは ${fmt(pool[0].value)} です。ひとつ戻して考えよう！`,false);
    }else feedback(`答えの ${fmt(result)} が新しい数字になったよ！`,true);
  }
  function safeValue(){const raw=tokens.map(t=>t.type==='num'?t.label:opMap[t.label]).join('');if(!/^[0-9+*/().-]+$/.test(raw))throw Error();return Function('"use strict";return ('+raw+')')()}
  function check(){
    if(mode!=='single')return;
    const used=tokens.filter(t=>t.type==='num');if(used.length!==5||new Set(used.map(t=>t.id)).size!==5)return feedback('5つの数字を全部1回ずつ使いましょう。',false);
    let value;try{value=safeValue()}catch{return feedback('数字と記号の順番を確認してね。',false)}
    if(!Number.isFinite(value)||Math.abs(value-set[index].target)>1e-9)return feedback(`計算すると ${Number.isFinite(value)?Math.round(value*100)/100:'?'} です。もう一度考えてみよう！`,false);
    correctAnswer();
  }
  function correctAnswer(){clearInterval(tick);updateTimer();solved++;saveBest();beep();const isLast=index===7;if(isLast){els.score.textContent=solved;setTimeout(finish,450)}else setTimeout(()=>{index++;load()},900)}
  function switchMode(next){if(mode===next)return;mode=next;els.app.classList.toggle('step-mode',mode==='step');els.modes.forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));resetWork()}
  function solutionSteps(solution){
    const parts=solution.match(/\d+|[＋−×÷]/g),values=parts.filter((_,i)=>i%2===0).map(Number),ops=parts.filter((_,i)=>i%2===1),lines=[];
    for(const group of [['×','÷'],['＋','−']]){let i;while((i=ops.findIndex(x=>group.includes(x)))>=0){const a=values[i],b=values[i+1],op=ops[i],v=calc(a,op,b);lines.push(`${fmt(a)}${op}${fmt(b)}＝${fmt(v)}`);values.splice(i,2,v);ops.splice(i,1)}}return lines.join(' → ');
  }
  function feedback(text,ok){els.msg.textContent=text;els.msg.className='message '+(ok?'ok':'bad')}
  function key(){return 'jamaica-best-'+set[index].target+'-'+[...set[index].nums].sort().join('')}
  function showBest(){const b=localStorage.getItem(key());els.best.textContent=b?Number(b).toFixed(1)+'秒':'—'}
  function saveBest(){const k=key(),old=Number(localStorage.getItem(k));if(!old||elapsed<old){localStorage.setItem(k,elapsed);feedback('🏆 新記録！ だれよりも速い！ 計算チャンピオン！',true)}else feedback('🎉 正解！ よくできました！',true);showBest()}
  function finish(){const total=(Date.now()-setStart)/1000;els.total.textContent='8問の合計タイム：'+total.toFixed(1)+'秒';els.final.textContent=total<120?'信じられない速さ！ あなたは計算チャンピオンです！':total<240?'すばらしい集中力！ あなたは計算名人です！':'最後までやり切りました！ ねばり強さが最高です！';els.modal.classList.add('show');beep(true)}
  function beep(fanfare=false){if(!sound)return;try{const c=new AudioContext(),notes=fanfare?[523,659,784,1047]:[660,880];notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.08,c.currentTime+i*.14);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.14+.18);o.start(c.currentTime+i*.14);o.stop(c.currentTime+i*.14+.2)})}catch{}}
  els.nums.forEach((b,i)=>b.onclick=()=>addNum(i));els.keys.forEach(b=>b.onclick=()=>addOp(b.textContent));els.modes.forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));$('#stepEquals').onclick=calculateStep;$('#undo').onclick=undo;$('#clear').onclick=clear;$('#check').onclick=check;$('#hint').onclick=()=>feedback(mode==='single'?'正解例：'+set[index].solution:'分け方の例：'+solutionSteps(set[index].solution),true);$('#newSet').onclick=newSet;$('#again').onclick=newSet;$('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊 音あり':'🔇 音なし'};
  newSet();
})();
</script>
</body>
</html>
