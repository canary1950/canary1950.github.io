<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>段階別数独問題</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#263347;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:620px;margin:auto}h1{margin:8px 0;font-size:2rem}.sub{color:#64748b;margin:0 0 18px}.top,.controls,.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.top{justify-content:space-between}button,select{font:inherit;cursor:pointer;border:1px solid #cbd5e1;border-radius:10px;background:#fff;padding:10px 14px;color:#263347}button:active{transform:scale(.97)}button:hover{background:#edf3ff}.primary{background:#305bc6;color:white;border-color:#305bc6}.primary:hover{background:#244ba9}.timer{font-size:1.25rem;font-variant-numeric:tabular-nums;font-weight:700}.board{display:grid;grid-template-columns:repeat(9,1fr);width:100%;aspect-ratio:1;border:3px solid #243451;background:#243451;touch-action:manipulation}.cell{position:relative;display:grid;place-items:center;border:0;border-right:1px solid #b8c4d5;border-bottom:1px solid #b8c4d5;border-radius:0;background:#fff;padding:0;font-size:clamp(17px,5.5vw,31px);font-weight:600;color:#305bc6}.cell:nth-child(3n){border-right:2px solid #243451}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #243451}.cell.given{color:#273447;background:#edf1f7}.cell.peer{background:#e5ecfa}.cell.same{background:#cadbf8}.cell.selected{background:#a9c4f7;outline:3px solid #2a59c5;outline-offset:-3px;z-index:1}.cell.wrong{color:#c42335;background:#ffe3e7}.cell.selected.wrong{outline-color:#c42335}.cell.note{font-size:clamp(8px,1.7vw,11px);white-space:pre-wrap;line-height:1.15;text-align:center;letter-spacing:1px}.keypad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin:15px 0}.keypad button{padding:12px 0;font-size:1.2rem;font-weight:700}.keypad button.active{background:#cadbf8;border-color:#305bc6}.tools{justify-content:center}.status{min-height:1.5em;color:#4b5d76}.done{color:#13845a;font-weight:700}.board.solved .cell{animation:flash .9s ease-in-out 2}@keyframes flash{50%{background:#b8f3d5}}.hint{font-size:.87rem;color:#64748b;line-height:1.6}label{display:flex;align-items:center;gap:7px}@media(max-width:430px){body{padding:12px}.cell{font-size:6vw}.keypad button{padding:9px 0}.tools button{padding:8px 11px}}
</style></head><body><main><h1>段階別数独問題</h1><p class="sub">広告なしで、ゆっくり考える。 <small>更新版 2026.09.23.2</small></p><div class="top"><label>難易度 <select id="level"><option value="lv1">レベル1・入門</option><option value="lv2">レベル2・初級</option><option value="lv3">レベル3・初中級</option><option value="lv4">レベル4・中級</option><option value="lv5">レベル5・上級</option><option value="lv6">レベル6・難問</option><option value="lv7">レベル7・最難関</option></select></label><button id="new" class="primary">新しい問題</button><div class="timer" id="timer" aria-label="経過時間">00:00</div></div><div id="board" class="board" role="grid" aria-label="数独の盤面"></div><div id="keys" class="keypad"></div><div class="tools"><button id="pause">一時停止</button><button id="erase">消す</button><button id="hint">ヒント</button><button id="notes" aria-pressed="false">メモ: OFF</button><button id="undo">一手戻す</button><button id="sound" aria-pressed="true">音: ON</button></div><p id="status" class="status" role="status"></p><p class="hint">マスを選んで数字を押してください。同じ数字が淡い青で光ります。同じ行・列・3×3の枠に数字が重複すると赤で表示します。キーボードの数字・矢印・Deleteにも対応しています。ヒントは注目するマスと候補を示し、答えは埋めません。画面を離れるか２分間操作がないと時間を止めます。操作すると再開します。途中経過はこの端末に自動保存します。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),board=$('board'),keys=$('keys'),status=$('status');let solution=[],puzzle=[],entries=[],notes=[],selected=-1,chosen=0,level='lv1',started=Date.now(),elapsed=0,finished=false,noteMode=false,sound=true,paused=false,lastActivity=Date.now(),history=[];const ranges={lv1:[45,49],lv2:[41,44],lv3:[37,40],lv4:[33,36],lv5:[29,32],lv6:[25,28]};const expertSeed='000000010400000000020000000000050407008000300001090000300400200050100000000806000';const expertAnswer='693784512487512936125963874932651487568247391741398625319475268856129743274836159';const shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};const row=i=>Math.floor(i/9),col=i=>i%9,box=i=>Math.floor(row(i)/3)*3+Math.floor(col(i)/3);function makeSolution(){let digits=shuffle([1,2,3,4,5,6,7,8,9]),bands=shuffle([0,1,2]),stacks=shuffle([0,1,2]),rows=bands.flatMap(b=>shuffle([0,1,2]).map(n=>b*3+n)),cols=stacks.flatMap(b=>shuffle([0,1,2]).map(n=>b*3+n));return rows.flatMap(r=>cols.map(c=>digits[(r*3+Math.floor(r/3)+c)%9]))}function countSolutions(grid,limit=2){let count=0;function solve(){let best=-1,choices=null;for(let i=0;i<81;i++)if(!grid[i]){let used=new Set;for(let j=0;j<81;j++)if(grid[j]&&(row(i)===row(j)||col(i)===col(j)||box(i)===box(j)))used.add(grid[j]);let possible=[];for(let v=1;v<=9;v++)if(!used.has(v))possible.push(v);if(!possible.length)return;if(!choices||possible.length<choices.length){best=i;choices=possible;if(choices.length===1)break}}if(best<0){count++;return}for(let v of choices){grid[best]=v;solve();if(count>=limit)break}grid[best]=0}solve();return count}function solveGrid(source){let grid=source.slice();function solve(){let best=-1,choices=null;for(let i=0;i<81;i++)if(!grid[i]){let used=new Set;for(let j=0;j<81;j++)if(grid[j]&&(row(i)===row(j)||col(i)===col(j)||box(i)===box(j)))used.add(grid[j]);let opts=[];for(let n=1;n<=9;n++)if(!used.has(n))opts.push(n);if(!opts.length)return false;if(!choices||opts.length<choices.length){best=i;choices=opts;if(opts.length===1)break}}if(best<0)return true;for(let n of choices){grid[best]=n;if(solve())return true}grid[best]=0;return false}return solve()?grid:null}function expertPuzzle(){let digits=shuffle([1,2,3,4,5,6,7,8,9]),bands=shuffle([0,1,2]),stacks=shuffle([0,1,2]),rows=bands.flatMap(b=>shuffle([0,1,2]).map(n=>b*3+n)),cols=stacks.flatMap(b=>shuffle([0,1,2]).map(n=>b*3+n)),transpose=Math.random()<.5;let base=Array.from(expertSeed,Number),solved=Array.from(expertAnswer,Number);return {puzzle:Array.from({length:81},(_,i)=>{let r=row(i),c=col(i),v=base[rows[transpose?c:r]*9+cols[transpose?r:c]];return v?digits[v-1]:0}),solution:Array.from({length:81},(_,i)=>{let r=row(i),c=col(i),v=solved[rows[transpose?c:r]*9+cols[transpose?r:c]];return digits[v-1]})}}function generate(lvl){if(lvl==='lv7'){let e=expertPuzzle();solution=e.solution;puzzle=e.puzzle}else{solution=makeSolution();puzzle=solution.slice();let target=ranges[lvl][0]+Math.floor(Math.random()*(ranges[lvl][1]-ranges[lvl][0]+1)),remaining=81;for(let i of shuffle(Array.from({length:81},(_,i)=>i))){if(remaining<=target)break;let old=puzzle[i];puzzle[i]=0;if(countSolutions(puzzle.slice())!==1)puzzle[i]=old;else remaining--}}entries=puzzle.slice();notes=Array.from({length:81},()=>[]);history=[];selected=-1;chosen=0;elapsed=0;started=Date.now();lastActivity=started;paused=false;$('pause').textContent='一時停止';finished=false;noteMode=false;$('notes').textContent='メモ: OFF';$('notes').setAttribute('aria-pressed','false');status.textContent=lvl==='lv7'?'最難関の問題です。じっくり挑戦してください。':'新しい問題を始めました。';save();render()}function save(){try{localStorage.setItem('sudoku-v1',JSON.stringify({solution,puzzle,entries,notes,selected,chosen,level,elapsed:elapsed+((finished||paused)?0:Date.now()-started),finished,noteMode,sound,paused,history:history.slice(-100)}))}catch{}}function restore(){try{let d=JSON.parse(localStorage.getItem('sudoku-v1'));if(!d||!Array.isArray(d.solution)||d.solution.length!==81||!Array.isArray(d.puzzle)||d.puzzle.length!==81||!Array.isArray(d.entries)||d.entries.length!==81)return false;({solution,puzzle,entries,notes,selected,chosen,level,elapsed,finished,noteMode,sound,history}=d);notes=Array.isArray(notes)&&notes.length===81?notes:Array.from({length:81},()=>[]);history=history||[];paused=true;started=Date.now();lastActivity=started;$('pause').textContent=finished?'一時停止':'再開';level=({easy:'lv2',medium:'lv4',hard:'lv5',expert:'lv7'})[level]||level;if(level==='lv7'){let repaired=solveGrid(puzzle);if(!repaired)return false;solution=repaired}$('level').value=level;$('sound').textContent='音: '+(sound?'ON':'OFF');$('sound').setAttribute('aria-pressed',String(sound));$('notes').textContent='メモ: '+(noteMode?'ON':'OFF');$('notes').setAttribute('aria-pressed',String(noteMode));status.textContent=finished?'完成しました！':'前回の続きです。';render();return true}catch{return false}}function time(){let s=Math.floor((elapsed+((finished||paused)?0:Date.now()-started))/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}function conflict(i){let v=entries[i];if(!v)return false;for(let j=0;j<81;j++)if(i!==j&&entries[j]===v&&(row(i)===row(j)||col(i)===col(j)||box(i)===box(j)))return true;return false}function render(){board.innerHTML='';for(let i=0;i<81;i++){let b=document.createElement('button');b.type='button';b.className='cell';b.setAttribute('role','gridcell');b.setAttribute('aria-label',`${row(i)+1}行${col(i)+1}列 ${entries[i]||'空欄'}`);if(puzzle[i])b.classList.add('given');let v=entries[i];if(selected>=0){if(row(i)===row(selected)||col(i)===col(selected)||box(i)===box(selected))b.classList.add('peer');let highlight=chosen||entries[selected];if(highlight&&v===highlight)b.classList.add('same');if(i===selected)b.classList.add('selected')}if(v&&!puzzle[i]&&conflict(i))b.classList.add('wrong');if(v)b.textContent=v;else if(notes[i]?.length){b.classList.add('note');b.textContent=[1,2,3,4,5,6,7,8,9].map(n=>notes[i].includes(n)?n:'·').join('').replace(/(...)/g,'$1\n').trim()}b.onclick=()=>{activity();selected=i;chosen=entries[i]||chosen;render();save()};board.appendChild(b)}board.classList.toggle('solved',finished);keys.innerHTML='';for(let n=1;n<=9;n++){let b=document.createElement('button');b.type='button';b.textContent=n;b.setAttribute('aria-label',n+'を入力');if(chosen===n)b.classList.add('active');b.onclick=()=>input(n);keys.appendChild(b)}time()}function input(n){activity();if(selected<0){status.textContent='先にマスを選んでください。';return}if(puzzle[selected]||finished)return;history.push({entries:entries.slice(),notes:notes.map(a=>a.slice())});if(noteMode&&n){let a=notes[selected],k=a.indexOf(n);if(k<0)a.push(n);else a.splice(k,1)}else{entries[selected]=n;notes[selected]=[];if(n){for(let i=0;i<81;i++)if(row(i)===row(selected)||col(i)===col(selected)||box(i)===box(selected))notes[i]=notes[i].filter(x=>x!==n)}status.textContent=n&&conflict(selected)?'同じ行・列・3×3の枠に同じ数字があります。':''}chosen=n||0;if(entries.every((v,i)=>v===solution[i]))complete();save();render()}function complete(){if(!paused)elapsed+=Date.now()-started;finished=true;time();status.textContent='おめでとうございます！ '+$('timer').textContent+'で完成しました。';status.classList.add('done');if(sound){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();[523,659,784,1047].forEach((freq,k)=>{let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+k*.16;o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.3);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+.31)});setTimeout(()=>ctx.close(),1500)}catch{}}}function start(){if(!finished&&!confirm('今の問題を終えて、新しい問題を始めますか？'))return;status.classList.remove('done');level=$('level').value;generate(level)}$('new').onclick=start;$('level').onchange=()=>{if(!finished&&entries.some((v,i)=>!puzzle[i]&&v)){status.textContent='難易度を変更しました。「新しい問題」を押すと反映されます。'}else status.textContent='「新しい問題」を押すと選んだ難易度になります。'};$('pause').onclick=()=>{if(finished)return;if(paused){paused=false;started=Date.now();lastActivity=started;$('pause').textContent='一時停止';status.textContent='計測を再開しました。'}else pause('一時停止中です。「再開」を押してください。');save();time()};$('erase').onclick=()=>input(0);$('hint').onclick=()=>{activity();if(finished)return;let wrong=entries.findIndex((v,i)=>!puzzle[i]&&conflict(i));if(wrong>=0){selected=wrong;chosen=0;status.textContent=`${row(wrong)+1}行${col(wrong)+1}列の赤い数字を見直しましょう。同行・同列・同じ3×3の枠を確かめてください。`;render();save();return}let candidates=i=>{let used=new Set;for(let j=0;j<81;j++)if(entries[j]&&(row(i)===row(j)||col(i)===col(j)||box(i)===box(j)))used.add(entries[j]);return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n))};let open=Array.from({length:81},(_,i)=>i).filter(i=>!entries[i]);if(!open.length){status.textContent='空欄はありません。';return}let i=selected>=0&&!entries[selected]?selected:open.reduce((best,j)=>candidates(j).length<candidates(best).length?j:best,open[0]);let nums=candidates(i);selected=i;chosen=0;if(nums.length===1)status.textContent=`ヒント: ${row(i)+1}行${col(i)+1}列に注目。候補が一つに絞れます。同行・同列・同じ3×3の枠を確認してみましょう。`;else if(nums.length)status.textContent=`ヒント: ${row(i)+1}行${col(i)+1}列の候補は ${nums.join('・')}。同行・同列・同じ3×3の枠から絞ってみましょう。`;else status.textContent='このマスの候補がありません。入力した数字を見直してください。';render();save()};$('notes').onclick=()=>{activity();noteMode=!noteMode;$('notes').textContent='メモ: '+(noteMode?'ON':'OFF');$('notes').setAttribute('aria-pressed',String(noteMode));save()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent='音: '+(sound?'ON':'OFF');$('sound').setAttribute('aria-pressed',String(sound));save()};$('undo').onclick=()=>{activity();if(!history.length||finished)return;let h=history.pop();entries=h.entries;notes=h.notes;status.textContent='一手戻しました。';save();render()};document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(/^[1-9]$/.test(e.key)){input(Number(e.key));e.preventDefault()}else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0'){input(0);e.preventDefault()}else if(selected>=0&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){let r=row(selected),c=col(selected);if(e.key==='ArrowUp')r=(r+8)%9;if(e.key==='ArrowDown')r=(r+1)%9;if(e.key==='ArrowLeft')c=(c+8)%9;if(e.key==='ArrowRight')c=(c+1)%9;activity();selected=r*9+c;chosen=entries[selected]||chosen;render();save();e.preventDefault()}});function pause(message){if(finished||paused)return;elapsed+=Date.now()-started;paused=true;$('pause').textContent='再開';status.textContent=message;time();save()}function activity(){lastActivity=Date.now();if(!finished&&paused){paused=false;started=lastActivity;$('pause').textContent='一時停止';status.textContent='計測を再開しました。'}}document.addEventListener('visibilitychange',()=>{if(document.hidden)pause('画面を離れたため、時間を一時停止しました。')});setInterval(()=>{if(!finished&&!paused&&Date.now()-lastActivity>=120000)pause('操作がないため、時間を一時停止しました。');time();if(!finished)save()},1000);if(!restore())generate(level)})();
</script></body></html>
