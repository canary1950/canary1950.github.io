<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ジャマイカもどき｜8問チャレンジ</title>
  <style>
    :root{--ink:#263238;--blue:#1677c8;--yellow:#ffd54f;--orange:#ff8a3d;--green:#27ae60;--paper:#fffdf5;--shadow:0 8px 22px #17324d22}
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;background:linear-gradient(135deg,#bfe9ff,#fff4b8)}
    button{font:inherit;touch-action:manipulation}.app{width:min(760px,100%);margin:auto;padding:14px}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.title{font-size:clamp(25px,6vw,42px);font-weight:900;color:#075f9d;text-shadow:2px 2px white;margin:4px 0}.pill{background:#fff;border:3px solid #82c8ee;border-radius:999px;padding:8px 14px;font-weight:800;box-shadow:var(--shadow)}
    .card{background:var(--paper);border:5px solid white;border-radius:28px;padding:clamp(14px,4vw,28px);box-shadow:var(--shadow);position:relative;overflow:hidden}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.stat{background:#e9f7ff;border-radius:15px;padding:9px;text-align:center;font-weight:800}.stat strong{display:block;font-size:clamp(20px,5vw,30px);color:#0874bc}.home{display:inline-flex;align-items:center;text-decoration:none;color:#075f9d;background:#fff;border:3px solid #82c8ee;border-radius:999px;padding:8px 13px;font-weight:900;box-shadow:var(--shadow)}
    .board{position:relative;width:min(390px,92vw);aspect-ratio:1;margin:4px auto 10px}.num,.target{position:absolute;display:grid;place-items:center;border-radius:50%;font-weight:900;box-shadow:0 5px 0 #0002;user-select:none}.num{width:23%;height:23%;border:0;background:var(--yellow);color:#5b3d00;font-size:clamp(30px,9vw,50px);cursor:pointer}.num:disabled{opacity:.3;filter:grayscale(1);transform:scale(.9)}.num:nth-child(1){left:38.5%;top:0}.num:nth-child(2){right:3%;top:27%}.num:nth-child(3){right:17%;bottom:4%}.num:nth-child(4){left:17%;bottom:4%}.num:nth-child(5){left:3%;top:27%}.target{width:38%;height:38%;left:31%;top:31%;background:var(--orange);color:#fff;font-size:clamp(42px,13vw,70px);border:7px solid #fff}.target small{display:block;font-size:12px;line-height:1;margin-bottom:-15px}
    .expression{min-height:72px;background:#fff;border:4px dashed #80c6e8;border-radius:18px;padding:12px;text-align:center;font-size:clamp(25px,6vw,38px);font-weight:900;word-break:break-all}.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.key{border:0;border-radius:14px;background:#1677c8;color:#fff;min-height:52px;font-size:27px;font-weight:900;box-shadow:0 4px 0 #0c558f;cursor:pointer}.key:active,.action:active{transform:translateY(3px);box-shadow:none}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.action{border:0;border-radius:15px;padding:13px 8px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 #0002}.undo{background:#e4edf2}.clear{background:#ffe0b2}.check{background:var(--green);color:#fff}.message{min-height:55px;margin-top:12px;padding:12px;border-radius:16px;text-align:center;font-weight:900;font-size:18px}.message.ok{background:#dff7e7;color:#12652f}.message.bad{background:#ffe2e2;color:#a22222}.bottom{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}.secondary{border:2px solid #1681c5;background:#fff;color:#0966a0;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer}
    .modal{position:fixed;inset:0;background:#07365cdd;display:none;place-items:center;padding:20px;z-index:5}.modal.show{display:grid}.celebrate{width:min(520px,96vw);background:#fff9d6;border:8px solid #ffd54f;border-radius:32px;padding:28px;text-align:center;animation:pop .45s ease}.celebrate h2{font-size:clamp(35px,10vw,60px);margin:0;color:#f06b25}.celebrate p{font-size:22px;font-weight:900}.celebrate button{border:0;border-radius:999px;background:#1d9a54;color:#fff;padding:15px 25px;font-weight:900;font-size:20px}@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}}
    @media(max-width:520px){.app{padding:8px}.card{border-radius:20px;padding:12px}.stats{gap:5px}.stat{font-size:12px;padding:7px 3px}.keypad{gap:6px}.key{min-height:48px}.board{width:min(330px,88vw)}}
    /* 画面の高さに合わせた1画面表示 */
    @media(max-height:900px){
      body{overflow:hidden}.app{height:100vh;height:100dvh;padding:5px 8px;display:flex;flex-direction:column}.top{min-height:32px;flex-wrap:nowrap}.home,.pill{padding:4px 10px;border-width:2px;font-size:12px}.title{font-size:clamp(19px,4vw,27px);line-height:1.1;margin:1px 0 3px}.card{flex:1;min-height:0;border-width:3px;border-radius:18px;padding:7px 10px;display:flex;flex-direction:column}.stats{gap:5px;margin-bottom:3px}.stat{padding:3px;font-size:11px;border-radius:10px}.stat strong{display:inline;margin-left:4px;font-size:16px}.board{width:min(34vh,290px,72vw);margin:0 auto 3px;flex:0 0 auto}.num{font-size:clamp(24px,7vw,40px)}.target{font-size:clamp(34px,10vw,55px);border-width:5px}.target small{font-size:10px;margin-bottom:-10px}.expression{min-height:40px;padding:4px 8px;border-width:3px;border-radius:12px;font-size:clamp(20px,5vw,30px);display:grid;place-items:center}.keypad{gap:5px;margin-top:4px}.key{min-height:38px;border-radius:10px;font-size:22px;box-shadow:0 3px 0 #0c558f}.actions{grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}.action{min-height:38px;padding:5px 3px;border-radius:10px;font-size:12px}.check{grid-column:auto}.message{min-height:38px;margin-top:5px;padding:5px;border-radius:10px;font-size:13px;display:grid;place-items:center}.bottom{gap:4px;margin-top:5px;flex-wrap:nowrap}.secondary{padding:5px 7px;border-width:1px;font-size:11px;white-space:nowrap}
    }
    @media(max-height:680px){.title{font-size:18px}.board{width:min(29vh,210px,58vw)}.key{min-height:34px}.action{min-height:34px}.message{min-height:34px}.bottom{margin-top:3px}}
  </style>
</head>
<body>
<main class="app">
  <div class="top"><a class="home" href="index.html">← メニューへ戻る</a><span class="pill" id="progress">1 / 8</span></div>
  <h1 class="title">🎲 ジャマイカもどき</h1>
  <section class="card">
    <div class="stats"><div class="stat">タイム<strong id="timer">0.0秒</strong></div><div class="stat">ベスト<strong id="best">—</strong></div><div class="stat">正解数<strong id="score">0</strong></div></div>
    <div class="board" id="board"><button class="num"></button><button class="num"></button><button class="num"></button><button class="num"></button><button class="num"></button><div class="target"><small>めざす数</small><span id="target"></span></div></div>
    <div class="expression" id="expression" aria-live="polite">数字を押して式を作ろう！</div>
    <div class="keypad"><button class="key">＋</button><button class="key">−</button><button class="key">×</button><button class="key">÷</button><button class="key">（</button><button class="key">）</button></div>
    <div class="actions"><button class="action undo" id="undo">↩ ひとつ戻す</button><button class="action clear" id="clear">🧹 やり直す</button><button class="action check" id="check">✅ 答え合わせ</button></div>
    <div class="message" id="message">5つの数字を、それぞれ1回ずつ使ってね。</div>
    <div class="bottom"><button class="secondary" id="hint">💡 ヒント</button><button class="secondary" id="newSet">🔄 新しい8問</button><button class="secondary" id="sound">🔊 音あり</button></div>
  </section>
</main>
<div class="modal" id="modal"><div class="celebrate"><div style="font-size:60px">🏆🎉🌟</div><h2>8問クリア！</h2><p id="finalText">すばらしい！ あなたは計算名人です！</p><p id="totalTime"></p><button id="again">もう一度8問に挑戦</button></div></div>
<script>
(()=>{'use strict';
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const els={nums:$$('.num'),keys:$$('.key'),target:$('#target'),expr:$('#expression'),timer:$('#timer'),best:$('#best'),score:$('#score'),progress:$('#progress'),msg:$('#message'),modal:$('#modal'),final:$('#finalText'),total:$('#totalTime')};
  let set=[],index=0,solved=0,tokens=[],start=0,tick=null,elapsed=0,setStart=0,sound=true;
  const opMap={'＋':'+','−':'-','×':'*','÷':'/','（':'(', '）':')'};
  function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function makeProblem(){
    for(let tries=0;tries<200;tries++){
      const nums=shuffle([1,2,3,4,5,6,7,8,9]).slice(0,5), order=shuffle([...nums]);
      let val=order[0], text=String(order[0]);
      for(let i=1;i<5;i++){
        const n=order[i], choices=[['＋',(a,b)=>a+b],['−',(a,b)=>a-b],['×',(a,b)=>a*b]];
        if(n!==0 && Number.isInteger(val/n)) choices.push(['÷',(a,b)=>a/b]);
        const [sym,fn]=choices[Math.floor(Math.random()*choices.length)]; val=fn(val,n); text='('+text+sym+n+')';
      }
      if(Number.isInteger(val)&&val>=10&&val<=150) return {nums,target:val,solution:text.slice(1,-1)};
    }
    return {nums:[2,4,5,8,9],target:91,solution:'2＋5×（9＋8）＋4'};
  }
  function newSet(){set=Array.from({length:8},makeProblem);index=0;solved=0;setStart=Date.now();els.modal.classList.remove('show');load()}
  function load(){tokens=[];elapsed=0;start=Date.now();clearInterval(tick);tick=setInterval(updateTimer,100);const p=set[index];els.target.textContent=p.target;els.nums.forEach((b,i)=>{b.textContent=p.nums[i];b.disabled=false;b.dataset.id=i});els.score.textContent=solved;els.progress.textContent=`${index+1} / 8`;els.msg.className='message';els.msg.textContent='5つの数字を、それぞれ1回ずつ使ってね。';render();showBest();}
  function updateTimer(){elapsed=(Date.now()-start)/1000;els.timer.textContent=elapsed.toFixed(1)+'秒'}
  function render(){els.expr.textContent=tokens.length?tokens.map(t=>t.label).join(''):'数字を押して式を作ろう！'}
  function addNum(i){if(els.nums[i].disabled)return;tokens.push({type:'num',label:els.nums[i].textContent,id:i});els.nums[i].disabled=true;render()}
  function addOp(label){tokens.push({type:'op',label});render()}
  function undo(){const t=tokens.pop();if(t?.type==='num')els.nums[t.id].disabled=false;render()}
  function clear(){tokens=[];els.nums.forEach(b=>b.disabled=false);render()}
  function safeValue(){const raw=tokens.map(t=>t.type==='num'?t.label:opMap[t.label]).join('');if(!/^[0-9+*/().-]+$/.test(raw))throw Error();return Function('"use strict";return ('+raw+')')()}
  function check(){
    const used=tokens.filter(t=>t.type==='num');if(used.length!==5||new Set(used.map(t=>t.id)).size!==5)return feedback('5つの数字を全部1回ずつ使いましょう。',false);
    let value;try{value=safeValue()}catch{return feedback('式の順番や、かっこを確認してね。',false)}
    if(!Number.isFinite(value)||Math.abs(value-set[index].target)>1e-9)return feedback(`計算すると ${Number.isFinite(value)?Math.round(value*100)/100:'?'} です。もう一度考えてみよう！`,false);
    clearInterval(tick);updateTimer();solved++;saveBest();beep();const isLast=index===7;
    if(isLast){els.score.textContent=solved;setTimeout(finish,450)}else{feedback(elapsed<10?'⚡ ものすごい速さ！ 天才的！':'🎉 正解！ すばらしい！',true);setTimeout(()=>{index++;load()},900)}
  }
  function feedback(text,ok){els.msg.textContent=text;els.msg.className='message '+(ok?'ok':'bad')}
  function key(){return 'jamaica-best-'+set[index].target+'-'+[...set[index].nums].sort().join('')}
  function showBest(){const b=localStorage.getItem(key());els.best.textContent=b?Number(b).toFixed(1)+'秒':'—'}
  function saveBest(){const k=key(),old=Number(localStorage.getItem(k));if(!old||elapsed<old){localStorage.setItem(k,elapsed);feedback('🏆 新記録！ だれよりも速い！ 計算チャンピオン！',true)}else feedback('🎉 正解！ よくできました！',true);showBest()}
  function finish(){const total=(Date.now()-setStart)/1000;els.total.textContent='8問の合計タイム：'+total.toFixed(1)+'秒';els.final.textContent=total<120?'信じられない速さ！ あなたは計算チャンピオンです！':total<240?'すばらしい集中力！ あなたは計算名人です！':'最後までやり切りました！ ねばり強さが最高です！';els.modal.classList.add('show');beep(true)}
  function beep(fanfare=false){if(!sound)return;try{const c=new AudioContext(),notes=fanfare?[523,659,784,1047]:[660,880];notes.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.08,c.currentTime+i*.14);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+i*.14+.18);o.start(c.currentTime+i*.14);o.stop(c.currentTime+i*.14+.2)})}catch{}}
  els.nums.forEach((b,i)=>b.onclick=()=>addNum(i));els.keys.forEach(b=>b.onclick=()=>addOp(b.textContent));$('#undo').onclick=undo;$('#clear').onclick=clear;$('#check').onclick=check;$('#hint').onclick=()=>feedback('正解例：'+set[index].solution,true);$('#newSet').onclick=newSet;$('#again').onclick=newSet;$('#sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊 音あり':'🔇 音なし'};
  newSet();
})();
</script>
</body>
</html>
